
name: Bookstore CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookstore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Job 1: Build, test and validate the Spring Boot application
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Maven project
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f pom.xml
          test -f mvnw
          test -d src/main

          chmod +x ./mvnw

          java --version
          ./mvnw --version

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Validate application JAR
        shell: bash
        run: |
          set -Eeuo pipefail

          shopt -s nullglob

          jars=(
            target/*.jar
          )

          valid_jar=false

          for jar in "${jars[@]}"; do
            [[ "$jar" == *-sources.jar ]] && continue
            [[ "$jar" == *-javadoc.jar ]] && continue

            if [[ ! -s "$jar" ]]; then
              echo "::error::Application JAR is empty: $jar"
              exit 1
            fi

            echo "Application JAR validated."
            valid_jar=true
          done

          if [[ "$valid_jar" != true ]]; then
            echo "::error::No application JAR found."
            exit 1
          fi

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-test-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7


  # Job 2: Static Application Security Testing
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild
          queries: security-extended

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin


  # Job 3: Build, start and test the application using Docker Compose
  docker-compose-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 25

    needs: build-and-test

    env:
      POSTGRES_DB: bookstore_ci
      POSTGRES_USER: bookstore_ci
      POSTGRES_IMAGE_TAG: '15'

      APP_BUILD_CONTEXT: .
      APP_DOCKERFILE: Dockerfile
      APP_IMAGE_NAME: bookstore-app
      APP_IMAGE_TAG: ${{ github.sha }}
      APP_HOST_PORT: '18080'
      APP_CONTAINER_PORT: '8080'

      PGADMIN_DEFAULT_EMAIL: ci@example.com

      DB_VOLUME_NAME: bookstore-ci-data-${{ github.run_id }}-${{ github.run_attempt }}
      APP_NETWORK_NAME: bookstore-ci-app-${{ github.run_id }}-${{ github.run_attempt }}
      DB_NETWORK_NAME: bookstore-ci-db-${{ github.run_id }}-${{ github.run_attempt }}
      ADMIN_NETWORK_NAME: bookstore-ci-admin-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          test -f Dockerfile
          test -f docker-compose.yml

          docker --version
          docker compose version

      - name: Generate temporary CI credentials
        shell: bash
        run: |
          set -Eeuo pipefail

          db_password="$(openssl rand -hex 32)"
          pgadmin_password="$(openssl rand -hex 32)"

          echo "::add-mask::$db_password"
          echo "::add-mask::$pgadmin_password"

          {
            printf 'POSTGRES_PASSWORD=%s\n' "$db_password"
            printf 'PGADMIN_DEFAULT_PASSWORD=%s\n' "$pgadmin_password"
          } >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and start application stack
        run: |
          docker compose -f docker-compose.yml up \
            --build \
            --detach

      - name: Verify application endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              --output /dev/null \
              http://127.0.0.1:18080/books; then

              echo "Application smoke test passed."
              exit 0
            fi

            echo "Waiting for application: ${attempt}/60"
            sleep 5
          done

          echo "::error::Application did not become ready in time."

          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color app db

          exit 1

      - name: Export tested Docker image
        shell: bash
        run: |
          set -Eeuo pipefail

          image="${APP_IMAGE_NAME}:${APP_IMAGE_TAG}"

          docker image inspect "$image"

          docker save \
            --output bookstore-image.tar \
            "$image"

          test -s bookstore-image.tar

      - name: Upload tested Docker image
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-image-${{ github.sha }}
          path: bookstore-image.tar
          if-no-files-found: error
          retention-days: 1

      - name: Collect diagnostic logs
        if: failure()
        run: |
          docker compose -f docker-compose.yml ps || true
          docker compose -f docker-compose.yml logs --no-color app db || true

      - name: Clean up Compose services
        if: always()
        run: |
          docker compose -f docker-compose.yml down \
            --remove-orphans \
            --volumes \
            --timeout 10 || true


  # Job 4: Scan the exact tested image and generate its SBOM
  image-security:
    name: Image Security Scan and SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25

    needs: docker-compose-smoke-test

    permissions:
      contents: read

    steps:
      - name: Download tested Docker image
        uses: actions/download-artifact@v4
        with:
          name: bookstore-image-${{ github.sha }}
          path: image-artifact

      - name: Load tested Docker image
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s image-artifact/bookstore-image.tar

          docker load \
            --input image-artifact/bookstore-image.tar

          docker image inspect \
            "bookstore-app:${GITHUB_SHA}"

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: bookstore-app:${{ github.sha }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: bookstore-app:${{ github.sha }}
          scan-type: image
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-sbom-${{ github.sha }}
          path: sbom.spdx.json
          if-no-files-found: warn
          retention-days: 14


  # Job 5: Publish only the tested and scanned image
  docker-publish:
    name: Publish Image to Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20

    needs:
      - docker-compose-smoke-test
      - image-security
      - codeql

    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    permissions:
      contents: read

    steps:
      - name: Download tested Docker image
        uses: actions/download-artifact@v4
        with:
          name: bookstore-image-${{ github.sha }}
          path: image-artifact

      - name: Load tested Docker image
        shell: bash
        run: |
          set -Eeuo pipefail

          test -s image-artifact/bookstore-image.tar

          docker load \
            --input image-artifact/bookstore-image.tar

          docker image inspect \
            "bookstore-app:${GITHUB_SHA}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag Docker image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -Eeuo pipefail

          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::Docker Hub username is missing."
            exit 1
          fi

          SOURCE_IMAGE="bookstore-app:${GITHUB_SHA}"
          IMAGE_REPOSITORY="${DOCKERHUB_USERNAME}/bookstore-app"

          docker tag \
            "$SOURCE_IMAGE" \
            "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"

          docker tag \
            "$SOURCE_IMAGE" \
            "${IMAGE_REPOSITORY}:latest"

      - name: Push Docker image
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -Eeuo pipefail

          IMAGE_REPOSITORY="${DOCKERHUB_USERNAME}/bookstore-app"

          docker push "${IMAGE_REPOSITORY}:sha-${GITHUB_SHA}"
          docker push "${IMAGE_REPOSITORY}:latest"

      - name: Log out from Docker Hub
        if: always()
        run: docker logout || true