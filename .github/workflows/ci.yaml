
name: Bookstore CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bookstore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate Maven project
        run: |
          test -f pom.xml
          test -f mvnw
          chmod +x mvnw
          java -version
          ./mvnw --version

      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test reports and JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-build-${{ github.sha }}
          path: |
            target/*.jar
            target/surefire-reports/**
            target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 7

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild
          queries: security-extended

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'

  docker-compose-smoke-test:
    name: Docker Compose Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test

    env:
      POSTGRES_DB: bookstore_ci
      POSTGRES_USER: bookstore_ci
      POSTGRES_IMAGE_TAG: '15'

      APP_BUILD_CONTEXT: .
      APP_DOCKERFILE: Dockerfile
      APP_IMAGE_NAME: bookstore-app
      APP_IMAGE_TAG: ${{ github.sha }}
      APP_HOST_PORT: '18080'
      APP_CONTAINER_PORT: '8080'

      PGADMIN_DEFAULT_EMAIL: ci@example.com

      # Unique names avoid collisions between concurrent runs.
      DB_VOLUME_NAME: bookstore-ci-data-${{ github.run_id }}-${{ github.run_attempt }}
      APP_NETWORK_NAME: bookstore-ci-app-${{ github.run_id }}-${{ github.run_attempt }}
      DB_NETWORK_NAME: bookstore-ci-db-${{ github.run_id }}-${{ github.run_attempt }}
      ADMIN_NETWORK_NAME: bookstore-ci-admin-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Docker configuration
        run: |
          test -f Dockerfile
          test -f docker-compose.yml
          docker --version
          docker compose version

      - name: Generate temporary CI credentials
        shell: bash
        run: |
          set -Eeuo pipefail

          db_password="$(openssl rand -hex 32)"
          pgadmin_password="$(openssl rand -hex 32)"

          # Mask values before exposing them to later steps.
          echo "::add-mask::$db_password"
          echo "::add-mask::$pgadmin_password"

          # Make credentials available to subsequent steps.
          {
            printf 'POSTGRES_PASSWORD=%s\n' "$db_password"
            printf 'PGADMIN_DEFAULT_PASSWORD=%s\n' "$pgadmin_password"
          } >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Build and start application and PostgreSQL
        run: docker compose -f docker-compose.yml up --build --detach

      - name: Smoke test application endpoint
        shell: bash
        run: |
          set -Eeuo pipefail

          for attempt in $(seq 1 60); do
            if curl --fail --silent \
              --output /tmp/books-response.json \
              http://127.0.0.1:18080/books; then
              echo "Smoke test passed."
              exit 0
            fi

            echo "Waiting for application: attempt ${attempt}/60"
            sleep 5
          done

          echo "Smoke test failed. Collecting diagnostic logs."
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs --no-color app db
          exit 1

      - name: Collect logs after failure
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color app db

      - name: Clean up Compose services
        if: always()
        run: docker compose -f docker-compose.yml down --remove-orphans --timeout 10
