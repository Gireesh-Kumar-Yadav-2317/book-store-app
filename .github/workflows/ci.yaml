
name: Book Store CI

on:
  push:
    branches:
      - main
      - 'feature/**'

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bookstore-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Build, test, and package the application
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate project structure
        run: |
          set -Eeuo pipefail

          for file in pom.xml mvnw; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done

          if [[ ! -d src/main ]]; then
            echo "::error::Required directory missing: src/main"
            exit 1
          fi

          chmod +x ./mvnw

          java -version
          ./mvnw --version

      - name: Build and run tests
        run: |
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Validate application JAR
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          jars=(target/*.jar)
          valid_jar=false

          for jar in "${jars[@]}"; do
            # Ignore source and Javadoc artifacts.
            if [[ "$jar" == *-sources.jar || "$jar" == *-javadoc.jar ]]; then
              continue
            fi

            if [[ ! -s "$jar" ]]; then
              echo "::error::JAR is empty: $jar"
              exit 1
            fi

            echo "Validated artifact: $jar"
            valid_jar=true
          done

          if [[ "$valid_jar" != true ]]; then
            echo "::error::No application JAR found in target/"
            exit 1
          fi

      - name: Upload test reports
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-test-reports-${{ github.run_id }}
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload application JAR
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: bookstore-application-${{ github.sha }}
          path: |
            target/*.jar
            !target/*-sources.jar
            !target/*-javadoc.jar
          if-no-files-found: error
          retention-days: 7

  # Job 2: GitHub CodeQL static application security testing
  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: autobuild
          queries: security-extended

      - name: Analyze source code
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
  docker-build-smoke-test:
    name: Docker Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    needs: build-and-test

    steps: 
      - name: Checkout source code
        uses: actions/checkout@v4
      
      - name: Validate Docker configuration
        shell: bash
        run: |
          set -Eeuo pipefail

          if [[ ! -f Dockerfile ]]; then
            echo "::error::Dockerfile not found the project"
            exit 1
          fi
          
          if [[ ! -f docker-compose.yaml && ! -f compose.yaml && ! -f  compose.yml && 1 -f docker-compose.yml ]]; then
            echo "::notice::No Compose file found; testing the Docker image directly"
          fi


      - name: Build Docker Image
        run: | 
          docker build \ 
            -- pull \
            --tag bookstore-app:${{ github.sha }}
      
      - name: Start application container
        run: |
          docker run \
            --detach \
            --name bookstore-smoke-test \
            --publish 127.0.0.1:18080:8080 \
            bookstore-app:${{ github.sha }}

      - name: wait for application readiness
        shell: bash
        run: | 
          set -Eeuo pipefai;

          for attempt in {1..30}; do 
            if curl --fail --silent --show-error \
              http://127.0.01:18080/books; then
              echo 
              echo "Application smaoke test passed"
              exit 0
            fi
            echo "Attempt $attempt/30: application is not ready yet"
            sleep 5
          done


          echo "::error::Application did not become ready within 150 seconds"
          docker logs bookstore-smoke-test || true
          exit 1
      - name: Show container logs on failure
        if: ${{ failure() }}
        run: docker logs bookstore-smoke-test || true

      - name: Cleanup smoke-test container
        if: ${{ always() }}
        run: |
          docker rm --force bookstore-smoke-test || true